<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crisol Crowling</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Navbar -->
  <link rel="stylesheet" href="navbar/navbar.css">
</head>

<body>

  <header class="cc-navbar">
    <div class="cc-navbar-inner">

      <!-- Logo / Brand -->
      <a href="#" class="cc-navbar-brand" aria-label="Crisol Crowling - Inicio">
        <span class="cc-navbar-name">Crisol Crowling</span>
      </a>

      <!-- Desktop navigation -->
      <nav class="cc-navbar-desktop" aria-label="Navegación principal">

        <a href="#about" class="cc-navbar-link">
          About
        </a>

        <a href="#art" class="cc-navbar-link">
          Art
        </a>

        <!-- Commissions dropdown -->
        <div class="cc-navbar-dropdown">
          <button
            class="cc-navbar-link cc-navbar-dropdown-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="desktop-commissions-menu"
          >
            Commissions
            <span class="cc-navbar-chevron" aria-hidden="true"></span>
          </button>

          <div
            id="desktop-commissions-menu"
            class="cc-navbar-dropdown-menu"
          >
            <a href="#commissions">Info</a>
            <a href="#prices">Prices</a>
            <a href="#terms">Terms</a>
          </div>
        </div>

        <a href="#contact" class="cc-navbar-link">
          Contact
        </a>

      </nav>

      <!-- Mobile menu button -->
      <button
        class="cc-navbar-menu-button"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="cc-mobile-menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

    <!-- Mobile navigation -->
    <nav
      id="cc-mobile-menu"
      class="cc-navbar-mobile"
      aria-label="Navegación móvil"
      aria-hidden="true"
    >

      <div class="cc-mobile-menu-inner">

        <a href="#about" class="cc-mobile-link">
          About
        </a>

        <a href="#art" class="cc-mobile-link">
          Art
        </a>

        <!-- Mobile commissions -->
        <div class="cc-mobile-dropdown">

          <button
            class="cc-mobile-link cc-mobile-dropdown-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="mobile-commissions-menu"
          >
            <span>Commissions</span>
            <span class="cc-navbar-chevron" aria-hidden="true"></span>
          </button>

          <div
            id="mobile-commissions-menu"
            class="cc-mobile-dropdown-menu"
          >
            <a href="#commissions">Info</a>
            <a href="#prices">Prices</a>
            <a href="#terms">Terms</a>
          </div>

        </div>

        <a href="#contact" class="cc-mobile-link">
          Contact
        </a>

      </div>

    </nav>

  </header>


  <!-- Dummy content for testing -->
  <main class="cc-demo-content">

    <section id="about">
      <h1>About</h1>
      <p>
        Contenido de prueba para comprobar el comportamiento de la navbar.
      </p>
    </section>

    <section id="art">
      <h2>Art</h2>
    </section>

    <section id="commissions">
      <h2>Commissions</h2>
    </section>

    <section id="prices">
      <h2>Prices</h2>
    </section>

    <section id="terms">
      <h2>Terms</h2>
    </section>

    <section id="contact">
      <h2>Contact</h2>
    </section>

  </main>


  <script src="navbar/navbar.js"></script>

</body>
</html>
